name: Build Signal TV - Windows EXE + Android APK

on:
  workflow_dispatch:

jobs:

  # ============================================================
  # WINDOWS EXE
  # ============================================================
  build-windows:
    name: Build Signal TV Windows EXE
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify Node.js
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build Vite application
        run: npm run build

      - name: Build Windows EXE
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Signal-TV-Windows-EXE
          path: |
            dist/*.exe
            release/*.exe
            dist/**/*.exe
          if-no-files-found: error


  # ============================================================
  # ANDROID APK
  # ============================================================
  build-android:
    name: Build Signal TV Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify Node.js
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build Vite application
        run: npm run build

      - name: Create Capacitor configuration
        shell: bash
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.signaltv.android',
            appName: 'Signal TV',
            webDir: 'dist'
          };

          export default config;
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Signal-TV-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
